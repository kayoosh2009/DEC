[package]
name = "dec"
version = "1.0.5"
edition = "2021"

[dependencies]
actix-web = "4"
actix-files = "0.6"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15"
anyhow = "1"
uuid = { version = "1.28.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
