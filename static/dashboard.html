<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEC — Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ─── Navbar ─────────────────────────────────────────── */
        .navbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 56px;
            background-color: #1E1E1E;
            border-bottom: 1px solid #2A2A2A;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 100;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: none;
            border: none;
            color: #666;
            font-family: 'Kotyhoroshko', sans-serif;
            font-size: 13px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: color 0.2s, background-color 0.2s;
        }

        .back-btn:hover {
            color: #F4F4F4;
            background-color: #2A2A2A;
        }

        .navbar-title {
            font-size: 14px;
            font-weight: 700;
            color: #888;
            letter-spacing: 1px;
        }

        /* ─── Page ───────────────────────────────────────────── */
        .page {
            margin-top: 56px;
            padding: 40px 24px 60px;
            max-width: 860px;
            margin-left: auto;
            margin-right: auto;
        }

        .page-heading {
            font-size: 22px;
            font-weight: 700;
            color: #E0E0E0;
            margin-bottom: 32px;
            letter-spacing: 0.5px;
        }

        /* ─── Token bar ──────────────────────────────────────── */
        .token-section {
            background-color: #1A1A1A;
            border: 1px solid #2A2A2A;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .token-label {
            font-size: 12px;
            color: #555;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .token-numbers {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 12px;
        }

        .token-used {
            font-size: 32px;
            font-weight: 700;
            color: #E0E0E0;
        }

        .token-total {
            font-size: 13px;
            color: #444;
        }

        .token-bar-track {
            height: 6px;
            background-color: #2A2A2A;
            border-radius: 6px;
            overflow: hidden;
        }

        .token-bar-fill {
            height: 100%;
            background-color: #E0E0E0;
            border-radius: 6px;
            transition: width 0.6s ease;
        }

        .token-bar-fill.warning {
            background-color: #c0873a;
        }

        .token-bar-fill.critical {
            background-color: #b04040;
        }

        .token-reset {
            font-size: 11px;
            color: #444;
            margin-top: 10px;
        }

        /* ─── Stats row ──────────────────────────────────────── */
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background-color: #1A1A1A;
            border: 1px solid #2A2A2A;
            border-radius: 14px;
            padding: 20px 24px;
        }

        .stat-label {
            font-size: 12px;
            color: #555;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #E0E0E0;
        }

        .stat-sub {
            font-size: 11px;
            color: #444;
            margin-top: 4px;
        }

        /* ─── Chart ──────────────────────────────────────────── */
        .chart-section {
            background-color: #1A1A1A;
            border: 1px solid #2A2A2A;
            border-radius: 14px;
            padding: 24px;
        }

        .chart-heading {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .chart-wrap {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 120px;
        }

        .chart-bar-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            height: 100%;
            justify-content: flex-end;
        }

        .chart-bar {
            width: 100%;
            background-color: #2A2A2A;
            border-radius: 4px 4px 0 0;
            transition: background-color 0.2s;
            min-height: 2px;
        }

        .chart-bar:hover {
            background-color: #3A3A3A;
        }

        .chart-bar.today {
            background-color: #E0E0E0;
        }

        .chart-bar.today:hover {
            background-color: #F0F0F0;
        }

        .chart-day {
            font-size: 10px;
            color: #444;
        }

        .chart-day.today {
            color: #888;
        }

        .chart-empty {
            font-size: 13px;
            color: #444;
            text-align: center;
            padding: 40px 0;
            width: 100%;
        }

        /* ─── Loading ────────────────────────────────────────── */
        .loading {
            color: #444;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-left">
            <button class="back-btn" onclick="window.location.href='/index.html'">← Back</button>
            <span class="navbar-title">DASHBOARD</span>
        </div>
    </nav>

    <div class="page">
        <div class="page-heading">Platform overview</div>

        <!-- Token bar -->
        <div class="token-section">
            <div class="token-label">Tokens used this month</div>
            <div class="token-numbers">
                <span class="token-used" id="tokensUsed">—</span>
                <span class="token-total">of 3,000,000</span>
            </div>
            <div class="token-bar-track">
                <div class="token-bar-fill" id="tokenBar" style="width: 0%"></div>
            </div>
            <div class="token-reset" id="tokenReset">Resets on the 1st of next month</div>
        </div>

        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-label">Messages sent (platform)</div>
                <div class="stat-value" id="messagesCount">—</div>
                <div class="stat-sub">all time</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Tokens spent (you, this month)</div>
                <div class="stat-value" id="userTokens">—</div>
                <div class="stat-sub">your usage</div>
            </div>
        </div>

        <!-- Chart -->
        <div class="chart-section">
            <div class="chart-heading">Your token usage — this month</div>
            <div class="chart-wrap" id="chartWrap">
                <div class="chart-empty loading">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const TOKEN_MAX = 3_000_000;

        initFirebase().then(() => {
            auth.onAuthStateChanged(async user => {
                if (!user) {
                    window.location.href = '/login.html';
                    return;
                }
                await loadDashboard(user);
            });
        });

        async function loadDashboard(user) {
            const idToken = await user.getIdToken();

            // Platform stats
            await loadPlatformStats();

            // User stats
            await loadUserStats(user.uid, idToken);
        }

        async function loadPlatformStats() {
            try {
                const resp = await fetch('/dashboard/stats');
                if (!resp.ok) return;
                const data = await resp.json();

                const used = data.tokens_used || 0;
                const messages = data.messages_count || 0;

                document.getElementById('tokensUsed').textContent = used.toLocaleString('en');
                document.getElementById('messagesCount').textContent = messages.toLocaleString('en');

                const pct = Math.min((used / TOKEN_MAX) * 100, 100);
                const bar = document.getElementById('tokenBar');
                bar.style.width = pct + '%';
                if (pct >= 90) bar.classList.add('critical');
                else if (pct >= 70) bar.classList.add('warning');

                // Days until reset
                const now = new Date();
                const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
                const days = Math.ceil((nextMonth - now) / (1000 * 60 * 60 * 24));
                document.getElementById('tokenReset').textContent = `Resets in ${days} day${days !== 1 ? 's' : ''}`;
            } catch (e) {
                console.error('Platform stats error:', e);
            }
        }

        async function loadUserStats(uid, idToken) {
            try {
                const resp = await fetch(`/dashboard/user?uid=${uid}&id_token=${encodeURIComponent(idToken)}`);
                if (!resp.ok) return;
                const data = await resp.json();

                document.getElementById('userTokens').textContent = (data.tokens_this_month || 0).toLocaleString('en');

                renderChart(data.daily_tokens || {});
            } catch (e) {
                console.error('User stats error:', e);
            }
        }

        function renderChart(dailyTokens) {
            const wrap = document.getElementById('chartWrap');
            wrap.innerHTML = '';

            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = now.getDate();

            const values = [];
            for (let d = 1; d <= daysInMonth; d++) {
                const key = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                values.push({ day: d, tokens: dailyTokens[key] || 0 });
            }

            const max = Math.max(...values.map(v => v.tokens), 1);

            if (max === 1) {
                wrap.innerHTML = '<div class="chart-empty">No usage data yet</div>';
                return;
            }

            for (const { day, tokens } of values) {
                const col = document.createElement('div');
                col.classList.add('chart-bar-col');

                const bar = document.createElement('div');
                bar.classList.add('chart-bar');
                if (day === today) bar.classList.add('today');
                const heightPct = (tokens / max) * 100;
                bar.style.height = heightPct + '%';
                bar.title = `${day} — ${tokens.toLocaleString('en')} tokens`;

                const label = document.createElement('div');
                label.classList.add('chart-day');
                if (day === today) label.classList.add('today');
                // Show only every 5th day label to avoid clutter
                label.textContent = (day % 5 === 0 || day === 1 || day === today) ? day : '';

                col.appendChild(bar);
                col.appendChild(label);
                wrap.appendChild(col);
            }
        }
    </script>
</body>
</html>
